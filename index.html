<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Bunnie 🤍</title>
<style>
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:'Segoe UI',sans-serif;
  color:white;
  text-align:center;
}

/* Scenes */
.scene{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.active{
  display:flex;
}

/* Glow text */
.glow{
  font-size:28px;
  text-shadow:0 0 10px #ff69b4,0 0 20px #ff1493;
  animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* Cake */
.cake{
  position:relative;
  margin-top:30px;
}

.layer{
  width:200px;
  height:50px;
  background:linear-gradient(45deg,#ff69b4,#ff1493);
  margin:8px auto;
  border-radius:10px;
  box-shadow:0 0 20px #ff1493;
}

.layer:nth-child(2){
  width:170px;
}

.layer:nth-child(3){
  width:140px;
}

.candle{
  width:10px;
  height:40px;
  background:white;
  margin:auto;
  position:relative;
  cursor:pointer;
}

.flame{
  width:15px;
  height:15px;
  background:orange;
  border-radius:50%;
  position:absolute;
  top:-18px;
  left:-2px;
  box-shadow:0 0 20px yellow;
  animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}

/* Slides */
.slide{
  font-size:20px;
  padding:30px;
  animation:fadeIn 2s ease forwards;
}

/* Sparkles */
.sparkle{
  position:absolute;
  width:4px;
  height:4px;
  background:pink;
  border-radius:50%;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}
</style>
</head>
<body>

<!-- START -->
<div id="start" class="scene active">
  <h1 class="glow">Hold for 2 seconds 💖</h1>
</div>

<!-- INTRO -->
<div id="intro" class="scene">
  <h1 class="glow">Happy Birthday Bunnie 🤍🎀</h1>
</div>

<!-- CAKE -->
<div id="cakeScene" class="scene">
  <div class="cake">
    <div class="candle" id="candle">
      <div class="flame" id="flame"></div>
    </div>
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
  </div>
  <p style="margin-top:20px;opacity:0.7;">Tap the candle 🕯</p>
</div>

<!-- SLIDES -->
<div id="slides" class="scene"></div>

<!-- END -->
<div id="end" class="scene">
  <h1 class="glow">Always with you 🤍<br>Many more happy returns daaa 🎂🎀</h1>
</div>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6a4f5a90e6.mp3?filename=romantic-background-112191.mp3" type="audio/mpeg">
</audio>

<script>
const texts = [
"Deyy Mosakutty, Happie poranthanaal daa 😘... Enaku unna romba pudikum...",
"Daily unta pesama naal eh nalla pogathu...",
"Nee enakku romba special daa 🤍",
"Naa express pannala naalum, enna warm ahh vechukitta daa nee 🫂",
"One day meet pannuvom... fulla happiya time spend pannuvom.. wait pannuvom...",
"Inga paaru, nee eppavum happiya irukkanum daa 🎀😊... LOVE YOUH 🤍"
];

let current=0;
const start=document.getElementById("start");
const intro=document.getElementById("intro");
const cakeScene=document.getElementById("cakeScene");
const slides=document.getElementById("slides");
const end=document.getElementById("end");
const candle=document.getElementById("candle");
const flame=document.getElementById("flame");
const music=document.getElementById("bgm");

/* HOLD START */
let holdTimer;

document.body.addEventListener("touchstart",()=>{
  holdTimer=setTimeout(()=>{
    start.classList.remove("active");
    intro.classList.add("active");
    music.volume=0.6;
    music.play().catch(()=>{});
    setTimeout(()=>{
      intro.classList.remove("active");
      cakeScene.classList.add("active");
    },2500);
  },2000);
});

document.body.addEventListener("touchend",()=>{
  clearTimeout(holdTimer);
});

/* Candle click */
candle.addEventListener("click",()=>{
  flame.style.display="none";
  setTimeout(()=>{
    cakeScene.classList.remove("active");
    slides.classList.add("active");
    showSlide();
  },1000);
});

function showSlide(){
  if(current>=texts.length){
    slides.classList.remove("active");
    end.classList.add("active");
    return;
  }
  slides.innerHTML=`<div class="slide">${texts[current]}</div>`;
  current++;
  setTimeout(showSlide,6000);
}

/* Sparkles */
for(let i=0;i<40;i++){
  let s=document.createElement("div");
  s.className="sparkle";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(4+Math.random()*5)+"s";
  document.body.appendChild(s);
}
</script>

</body>
</html>
