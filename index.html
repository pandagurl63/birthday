<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🖤</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at top, #111 0%, #000 60%);
  font-family: 'Segoe UI', sans-serif;
  color:white;
}

.scene{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  opacity:0;
  transition:opacity 1s ease;
}

.active{ opacity:1; }

.glow{
  text-shadow:0 0 10px #ff4d9d, 0 0 20px #ff4d9d;
}

.button{
  padding:15px 30px;
  border:1px solid #ff4d9d;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

.button:hover{
  box-shadow:0 0 20px #ff4d9d;
}

#cake{
  width:200px;
  height:150px;
  background:#222;
  border-radius:10px;
  position:relative;
  margin-top:20px;
}

#cream{
  width:100%;
  height:30px;
  background:#ff4d9d;
  position:absolute;
  top:-30px;
  border-radius:10px 10px 0 0;
  opacity:0;
}

#candle{
  width:10px;
  height:40px;
  background:white;
  position:absolute;
  top:-60px;
  left:95px;
  opacity:0;
}

#flame{
  width:12px;
  height:12px;
  background:orange;
  border-radius:50%;
  position:absolute;
  top:-75px;
  left:94px;
  opacity:0;
  animation:flicker 1s infinite alternate;
}

@keyframes flicker{
  from{ transform:scale(1); }
  to{ transform:scale(1.2); }
}

.slide{
  max-width:80%;
  text-align:center;
  font-size:18px;
  opacity:0;
  transform:scale(0.9);
  transition:all 0.8s ease;
}

.slide.active{
  opacity:1;
  transform:scale(1);
}

#final{
  font-size:40px;
}

#particles{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

canvas{
  position:absolute;
  top:0;
  left:0;
}

</style>
</head>

<body>

<audio id="music" autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b9f1c98a1.mp3?filename=beautiful-piano-ambient-110624.mp3">
</audio>

<canvas id="particles"></canvas>

<div id="hold" class="scene active">
  <div class="button glow">Press & Hold to Enter 🖤</div>
</div>

<div id="cakeScene" class="scene">
  <div class="glow">Happie Birthday Bunniee 💖</div>
  <div id="cake">
    <div id="cream"></div>
    <div id="candle"></div>
    <div id="flame"></div>
  </div>
  <div style="margin-top:20px;">Tap the candle to blow 🕯️</div>
</div>

<div id="slidesScene" class="scene">
  <div id="slidesContainer"></div>
</div>

<div id="finalScene" class="scene">
  <div id="final" class="glow">LOVE YOU 🤍</div>
  <div style="margin-top:20px;">One day we'll meet… Until then… I'm yours.</div>
</div>

<script>
const hold = document.getElementById("hold");
const cakeScene = document.getElementById("cakeScene");
const slidesScene = document.getElementById("slidesScene");
const finalScene = document.getElementById("finalScene");
const cream = document.getElementById("cream");
const candle = document.getElementById("candle");
const flame = document.getElementById("flame");
const slidesContainer = document.getElementById("slidesContainer");
const music = document.getElementById("music");

let holdTimer;

hold.addEventListener("mousedown", ()=>{
  holdTimer=setTimeout(()=>{
    hold.classList.remove("active");
    cakeScene.classList.add("active");
    startCake();
  },2000);
});

hold.addEventListener("mouseup", ()=> clearTimeout(holdTimer));

function startCake(){
  setTimeout(()=> cream.style.opacity=1,500);
  setTimeout(()=> candle.style.opacity=1,1200);
  setTimeout(()=> flame.style.opacity=1,1800);
}

flame.addEventListener("click", ()=>{
  flame.style.opacity=0;
  setTimeout(()=>{
    cakeScene.classList.remove("active");
    slidesScene.classList.add("active");
    startSlides();
  },1000);
});

const texts = [
"Deyy Mosakutty, Happie poranthanaal daa 😘...Enaku unna romba pudikum...",
"Daily unta pesama naal eh nalla pogathu...",
"Nee enakku romba special daa 🤍",
"Naa ethume express pannikaama cold ah iruntha haalu, enna warm ahh vechukitta daa nee 💪🏻🫂",
"One day meet pannuvom... Cherriyaa... orunaal fulla happiya time spend pannuvom.. wait pannuvom...",
"Inga paaru, inniku epdi happiya irukkiyoo, atheyy maari eppaiyum nee happiya irukkanum daah 🎀😇... LOVE YOUH 🤍"
];

let current=0;

function startSlides(){
  createSlide();
}

function createSlide(){
  slidesContainer.innerHTML="";
  const div=document.createElement("div");
  div.className="slide active glow";
  div.innerText=texts[current];
  slidesContainer.appendChild(div);

  setTimeout(()=>{
    document.body.addEventListener("click",nextSlide,{once:true});
  },2000);
}

function nextSlide(){
  current++;
  if(current<texts.length){
    createSlide();
  }else{
    slidesScene.classList.remove("active");
    finalScene.classList.add("active");
  }
}

/* PARTICLES */

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<50;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    d:Math.random()*1
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(255,77,157,0.5)";
  ctx.beginPath();
  for(let i=0;i<particles.length;i++){
    let p=particles[i];
    ctx.moveTo(p.x,p.y);
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2,true);
  }
  ctx.fill();
  update();
}

function update(){
  for(let i=0;i<particles.length;i++){
    let p=particles[i];
    p.y+=p.d;
    if(p.y>canvas.height){
      p.y=0;
      p.x=Math.random()*canvas.width;
    }
  }
}

setInterval(draw,33);

</script>

</body>
</html>
