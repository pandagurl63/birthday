<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Vennamavaneyy 🎀</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
overflow:hidden;
color:white;
height:100vh;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

.container{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:2;
padding:20px;
}

.glow{
font-size:22px;
max-width:90%;
line-height:1.6;
opacity:0;
transform:translateY(30px);
transition:1.5s ease;
text-shadow:0 0 10px #ff4da6,
0 0 20px #ff4da6,
0 0 40px #ff4da6;
}

.glow.show{
opacity:1;
transform:translateY(0);
}

.big{
font-size:30px;
text-shadow:0 0 15px #ff4da6,
0 0 35px #ff4da6,
0 0 60px #ff4da6;
}

/* Cake */
.cake{
position:relative;
margin-top:20px;
animation:float 3s ease-in-out infinite;
display:flex;
flex-direction:column;
align-items:center;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

.layer{
width:220px;
height:50px;
border-radius:10px;
box-shadow:0 0 20px #ff4da6;
}

.layer1{background:#ff66b2;}
.layer2{background:#ff3385;}
.layer3{background:#ff1a75;}

.candle{
width:12px;
height:40px;
background:white;
border-radius:4px;
position:relative;
margin-bottom:5px;
}

.flame{
width:15px;
height:15px;
background:orange;
border-radius:50%;
position:absolute;
top:-15px;
left:-1.5px;
animation:flicker 0.2s infinite alternate;
box-shadow:0 0 15px orange,0 0 30px yellow;
}

@keyframes flicker{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* Butterflies */
.butterfly{
position:absolute;
font-size:22px;
animation:fly 15s linear infinite;
opacity:0.8;
filter:drop-shadow(0 0 8px #ff4da6);
}

@keyframes fly{
0%{transform:translateY(100vh) translateX(0);}
50%{transform:translateY(50vh) translateX(40px);}
100%{transform:translateY(-10vh) translateX(-40px);}
}

/* Tap text CENTER */
.tap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:20px;
opacity:0.8;
}

/* Smaller credit */
.credit{
position:absolute;
bottom:25px;
right:30px;
font-size:10px;
opacity:0.5;
}
</style>
</head>

<body>

<canvas id="sparkle"></canvas>

<div class="container" id="content">

<div class="tap">Tap Anywhere 💖</div>

<div class="glow" id="slideText"></div>

<div class="cake" id="cake" style="display:none;">
<div class="candle">
<div class="flame" id="flame"></div>
</div>
<div class="layer layer1"></div>
<div class="layer layer2"></div>
<div class="layer layer3"></div>
</div>

<div class="credit">
Created by Your Aalu
</div>

</div>

<audio id="music" autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3c7e0b5d5e.mp3?filename=romantic-background-112191.mp3" type="audio/mp3">
</audio>

<script>

const canvas=document.getElementById("sparkle");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<100;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
});
update();
}

function update(){
particles.forEach(p=>{
p.y+=0.3;
if(p.y>canvas.height){
p.y=0;
p.x=Math.random()*canvas.width;
}
});
}

setInterval(draw,33);

const slides=[
`Dey Mosakutty, Happie poranthanaal daah🎂😇! Unnoda special dayy vaa first time en kuda celebrate pannuraa!! Atha innum spl aakanum nu nenaikuren daa🎀✨`,
`Enakku unna romba pudikum😇 Unta pesama enaku naal eh nalla pogathu.. Start uhm nee tha end uhm nee thaan daa🎀😝`,
`Naa athigama express pannikaama cold ah irunthaalum enna warm aah vechukutta nee!! Nee enaku Romba special person🥹🫴🏻✨`,
`Soo, one day meet pannuvom, meet panni one day fulla time spend panlaam.. Manifestingg!⚡✨`,
`Inniku irukura maari eppaiyum nee happiya irukanum😇🤍 Hope this Makes you Happiee🤗!! Love youhhh!🥹🤍`,
`Happpieee Birthdayy Daa Vennamavaneyyyy🎀🎂`
];

let index=-1;
const text=document.getElementById("slideText");
const cake=document.getElementById("cake");
const flame=document.getElementById("flame");
const tap=document.querySelector(".tap");

document.body.addEventListener("click",()=>{
tap.style.display="none";
nextSlide();
});

function nextSlide(){
index++;
if(index<slides.length){
text.classList.remove("show");
setTimeout(()=>{
text.innerHTML=slides[index];
text.classList.add("show");
},300);

if(index===0){
cake.style.display="flex";
}
}else{
text.classList.add("big");
text.innerHTML="Happie Birthday da Vennamavaneyy🎀🎂<br><br>Once again love youhh!!";
}
}

cake.addEventListener("touchstart",()=>{
flame.style.display="none";
cake.style.animation="none";
});

for(let i=0;i<3;i++){
let b=document.createElement("div");
b.className="butterfly";
b.style.left=Math.random()*100+"vw";
b.style.animationDuration=(12+Math.random()*5)+"s";
b.innerHTML="🦋";
document.body.appendChild(b);
}

</script>
</body>
</html>
