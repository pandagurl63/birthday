<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:black;
  overflow:hidden;
  color:white;
  text-align:center;
  position:relative;
}

/* 🔥 SLOW MOVING BLACK NEON GRADIENT */
body::after{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:
  radial-gradient(circle at 30% 30%, rgba(255,0,150,0.25), transparent 40%),
  radial-gradient(circle at 70% 70%, rgba(138,43,226,0.25), transparent 40%),
  radial-gradient(circle at 50% 80%, rgba(255,77,240,0.2), transparent 40%);
  animation:moveGradient 18s linear infinite alternate;
  z-index:-2;
}

@keyframes moveGradient{
  0%{transform:translate(0,0) rotate(0deg)}
  100%{transform:translate(10%,10%) rotate(15deg)}
}

/* Sparkle overlay */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(white 1px, transparent 1px);
  background-size:50px 50px;
  animation:sparkle 8s linear infinite;
  opacity:0.12;
  z-index:-1;
}

@keyframes sparkle{
  from{transform:translate(0,0)}
  to{transform:translate(-50px,-50px)}
}

.screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.hidden{display:none}

/* Countdown */
#countdown{
  font-size:90px;
  color:#ff4df0;
  text-shadow:0 0 20px #ff4df0,0 0 40px white;
}

/* Cake */
.cake{position:relative;margin-top:40px}

.layer{
  width:220px;
  height:60px;
  background:linear-gradient(45deg,#ff4df0,#8a2be2);
  margin:0 auto;
  border-radius:20px;
  box-shadow:0 0 25px #ff4df0;
}
.layer:nth-child(2){width:170px}
.layer:nth-child(3){width:130px}

.candle{
  width:12px;
  height:45px;
  background:white;
  margin:0 auto;
  position:relative;
}

.flame{
  width:18px;
  height:18px;
  background:yellow;
  border-radius:50%;
  position:absolute;
  top:-18px;
  left:-3px;
  box-shadow:0 0 25px orange;
  animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
  from{transform:scale(1)}
  to{transform:scale(1.25)}
}

/* Neon Text */
.neon{
  font-family:'Great Vibes',cursive;
  font-size:40px;
  margin-top:30px;
  color:#fff;
  text-shadow:0 0 10px #ff4df0,0 0 25px #ff4df0;
}

/* Slides */
.slide{
  width:85%;
  max-width:400px;
  background:linear-gradient(135deg,#ff4df0,#8a2be2);
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 35px #ff4df0;
  position:absolute;
  left:100%;
  transition:0.6s ease;
}

.slide.active{
  left:7.5%;
}

.bunny{
  position:absolute;
  top:10px;
  left:15px;
  font-size:22px;
}

.slide p{
  margin-top:25px;
  font-size:15px;
  line-height:1.5;
}

/* Butterflies */
.butterfly{
  position:absolute;
  font-size:22px;
  animation:fly 18s linear infinite;
}

@keyframes fly{
  0%{transform:translateY(100vh) translateX(0)}
  50%{transform:translateY(40vh) translateX(50vw)}
  100%{transform:translateY(-10vh) translateX(100vw)}
}

/* Footer */
.footer{
  position:absolute;
  bottom:10px;
  right:10px;
  font-size:10px;
  opacity:0.6;
}
</style>
</head>
<body>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mp3">
</audio>

<!-- Countdown -->
<div id="countdownScreen" class="screen">
  <div id="countdown">5</div>
</div>

<!-- Cake -->
<div id="cakeScreen" class="screen hidden">
  <div class="cake" id="cake">
    <div class="candle"><div class="flame" id="flame"></div></div>
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
  </div>
  <div class="neon hidden" id="wishText">Happie Birthday En Vennamavaney✨😹</div>
</div>

<!-- Slides -->
<div id="slidesScreen" class="screen hidden"></div>

<div class="footer">created by ur aalu</div>

<script>
let count=5;
let countdownEl=document.getElementById("countdown");
let countdownScreen=document.getElementById("countdownScreen");
let cakeScreen=document.getElementById("cakeScreen");
let slidesScreen=document.getElementById("slidesScreen");
let wishText=document.getElementById("wishText");
let flame=document.getElementById("flame");
let bgm=document.getElementById("bgm");

let timer=setInterval(()=>{
  count--;
  countdownEl.textContent=count;
  if(count==0){
    clearInterval(timer);
    countdownScreen.classList.add("hidden");
    cakeScreen.classList.remove("hidden");
  }
},1000);

/* Double Tap */
let lastTap=0;
document.getElementById("cake").addEventListener("click",function(){
  let now=new Date().getTime();
  if(now-lastTap<300){
    flame.style.display="none";
    wishText.classList.remove("hidden");
    setTimeout(()=>{
      cakeScreen.classList.add("hidden");
      slidesScreen.classList.remove("hidden");
      bgm.play();
      startSlides();
    },2000);
  }
  lastTap=now;
});

/* Slides Data */
let slides=[
`Happy Poranthanaal da Bunny🤗🤍! 
Hope everything goes fine from now! Happiyaa iruu!! Naa unkuda iruken🫂!`,

`Unnoda first Birthday with mee laa🥹! Naa unaku Blessingss Tharra!😌 Nalla iru Maganeyy🫂🤍`,

`Nee enaku Special person! Simple ah sollanum na, "Close to the Heart🫀"! Literally ethuku pudichuthu yen pudichuthu nu laam therilaa..😅 Aana pudichuthu😌! Love you Mine✨🤍`,

`Naa Sometimes nalla nadanthuka maata..! Epdina Cold ahh nadadanthupen..! Aana nee Warm ah vechukitta ennaa..! 🙃🫂 That's something  special daa! 🥹🤗! Enna purinjukanum nu Try pannura laa!! Athuve pothum daa🫂🤍`,

`Nee tha enakku Favourite uh!! Na engaiyu poga maata!! Promise pannuren🫳🏻!!! Poren nu sonnalu unta tha Varuven! Kavalai Vendam😌!
 Love you Chelloww😌🤍`,

`Atleast oru smile Vanthurukum nu namburaa!!😹 Athu pothum😌🫂! 
Nee sonna mari orunaal Meet pannuvom!!! Porumaiya papom!! Wait pannu!!! Cherriyaaa🥹🙏🏻!!! 
Kaathiruppom!! Manifestingg!!💪🏻✨!`,

`Happy Birthday Da HariHARAn!🤗✨
Love youh To the Core!🤍✨`
];

function startSlides(){
  let index=0;
  let slideDiv=document.createElement("div");
  slideDiv.className="slide active";
  slideDiv.innerHTML=`<div class="bunny">🐰</div><p>${slides[index]}</p>`;
  slidesScreen.appendChild(slideDiv);

  slidesScreen.addEventListener("click",()=>{
    slideDiv.classList.remove("active");
    setTimeout(()=>{
      index++;
      if(index<slides.length){
        slideDiv.innerHTML=`<div class="bunny">🐰</div><p>${slides[index]}</p>`;
        slideDiv.classList.add("active");
      }
    },400);
  });
}

/* Butterflies */
for(let i=0;i<4;i++){
  let b=document.createElement("div");
  b.className="butterfly";
  b.innerHTML="🦋";
  b.style.left=Math.random()*100+"vw";
  b.style.animationDuration=(14+Math.random()*8)+"s";
  document.body.appendChild(b);
}
</script>
</body>
</html>
