<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #fff0f5;
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .cake {
      font-size: 120px;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .card {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

  <h2>Tap the cake 🎂</h2>

  <div class="cake" onclick="showWishes()">🎂</div>

  <div id="wishes" class="hidden">
    <h1>🎉 Happy Birthday ❤️</h1>

    <div class="card">You make my days brighter 🌸</div>
    <div class="card">I’m always proud of you 💪</div>
    <div class="card">May all your dreams come true ✨</div>
  </div>

  <script>
    function showWishes() {
      document.getElementById("wishes").classList.remove("hidden");
    }
  </script>

</body>
</html>
