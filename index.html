<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:black;
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  color:white;
  text-align:center;
}

/* 🌌 Moving black gradient */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:
  radial-gradient(circle at 20% 20%, rgba(255,0,150,0.25), transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(138,43,226,0.25), transparent 40%);
  animation:bgmove 20s linear infinite alternate;
  z-index:-3;
}
@keyframes bgmove{
  0%{transform:translate(0,0)}
  100%{transform:translate(10%,10%)}
}

/* ✨ Flowing tiny white dots */
.particle{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:0.8;
  animation:flow linear infinite;
}
@keyframes flow{
  from{transform:translateY(100vh)}
  to{transform:translateY(-10vh)}
}

.screen{
  position:fixed;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.hidden{display:none}

/* Countdown */
#count{
  font-size:90px;
  color:#ff4df0;
  text-shadow:0 0 25px #ff4df0,0 0 40px white;
}

/* Cake */
.neon{
  font-family:'Great Vibes',cursive;
  font-size:40px;
  margin-bottom:20px;
  text-shadow:0 0 20px #ff4df0;
}

.cake{
  margin-top:20px;
}

.layer{
  width:220px;
  height:60px;
  background:linear-gradient(45deg,#ff4df0,#8a2be2);
  margin:0 auto;
  border-radius:20px;
  box-shadow:0 0 30px #ff4df0;
}
.layer:nth-child(2){width:170px}
.layer:nth-child(3){width:130px}

.candle{
  width:12px;
  height:45px;
  background:white;
  margin:0 auto;
  position:relative;
}

.flame{
  width:18px;
  height:18px;
  background:yellow;
  border-radius:50%;
  position:absolute;
  top:-18px;
  left:-3px;
  box-shadow:0 0 25px orange;
  animation:flicker 0.3s infinite alternate;
}
@keyframes flicker{
  from{transform:scale(1)}
  to{transform:scale(1.2)}
}

/* Slides */
.slide{
  width:85%;
  max-width:400px;
  background:linear-gradient(135deg,#ff4df0,#8a2be2);
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 35px #ff4df0;
  position:absolute;
  left:100%;
  transition:0.6s ease;
}
.slide.active{left:7.5%}

.bunny{
  position:absolute;
  top:10px;
  left:15px;
  font-size:22px;
}

.slide p{
  margin-top:25px;
  font-size:15px;
  line-height:1.5;
}

.footer{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:10px;
  opacity:0.6;
}
</style>
</head>
<body>

<audio id="bgm" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mp3">
</audio>

<div id="countScreen" class="screen">
<div id="count">5</div>
</div>

<div id="cakeScreen" class="screen hidden">
<div class="neon hidden" id="wish">Happie Birthday En Vennamavaney✨😹</div>
<div class="cake" id="cakeTap">
<div class="candle"><div class="flame" id="flame"></div></div>
<div class="layer"></div>
<div class="layer"></div>
<div class="layer"></div>
</div>
</div>

<div id="slideScreen" class="screen hidden"></div>

<div class="footer">created by ur aalu</div>

<script>

/* 🎇 particles */
for(let i=0;i<60;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(5+Math.random()*10)+"s";
document.body.appendChild(p);
}

/* Countdown */
let c=5;
let countEl=document.getElementById("count");
let timer=setInterval(()=>{
c--;
countEl.innerHTML=c;
if(c==0){
clearInterval(timer);
document.getElementById("countScreen").classList.add("hidden");
document.getElementById("cakeScreen").classList.remove("hidden");
}
},1000);

/* Cake tap */
document.getElementById("cakeTap").onclick=function(){
document.getElementById("flame").style.display="none";
document.getElementById("wish").classList.remove("hidden");
setTimeout(()=>{
document.getElementById("cakeScreen").classList.add("hidden");
document.getElementById("slideScreen").classList.remove("hidden");
document.getElementById("bgm").play();
startSlides();
},2000);
};

/* Slides */
let slides=[
`Happy Poranthanaal da Bunny🤗🤍! 
Hope everything goes fine from now! Happiyaa iruu!! Naa unkuda iruken🫂!`,

`Unnoda first Birthday with mee laa🥹! Naa unaku Blessingss Tharra!😌 Nalla iru Maganeyy🫂🤍`,

`Nee enaku Special person! Simple ah sollanum na, "Close to the Heart🫀"! Literally ethuku pudichuthu yen pudichuthu nu laam therilaa..😅 Aana pudichuthu😌! Love you Mine✨🤍`,

`Naa Sometimes nalla nadanthuka maata..! Epdina Cold ahh nadadanthupen..! Aana nee Warm ah vechukitta ennaa..! 🙃🫂 That's something  special daa! 🥹🤗! Enna purinjukanum nu Try pannura laa!! Athuve pothum daa🫂🤍`,

`Nee tha enakku Favourite uh!! Na engaiyu poga maata!! Promise pannuren🫳🏻!!! Poren nu sonnalu unta tha Varuven! Kavalai Vendam😌!
 Love you Chelloww😌🤍`,

`Atleast oru smile Vanthurukum nu namburaa!!😹 Athu pothum😌🫂! 
Nee sonna mari orunaal Meet pannuvom!!! Porumaiya papom!! Wait pannu!!! Cherriyaaa🥹🙏🏻!!! 
Kaathiruppom!! Manifestingg!!💪🏻✨!`,

`Happy Birthday Da HariHARAn!🤗✨
Love youh To the Core!🤍✨`
];

function startSlides(){
let i=0;
let box=document.createElement("div");
box.className="slide active";
box.innerHTML=`<div class="bunny">🐰</div><p>${slides[i]}</p>`;
document.getElementById("slideScreen").appendChild(box);

document.getElementById("slideScreen").onclick=function(){
box.classList.remove("active");
setTimeout(()=>{
i++;
if(i<slides.length){
box.innerHTML=`<div class="bunny">🐰</div><p>${slides[i]}</p>`;
box.classList.add("active");
}
},400);
};
}
</script>

</body>
</html>
